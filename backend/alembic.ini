# A generic, single database configuration.

[alembic]
# Path to migration scripts, relative to this file's directory.
script_location = alembic

# Jinja2 template for migration file names.
# %(year)d %(month).2d %(day).2d %(hour).2d %(minute).2d %(second).2d %(rev)s %(slug)s
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone used when generating file names.
timezone = UTC

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# sys.path is searched for alembic commands (for env.py, script.py.mako imports)
prepend_sys_path = .

# version_path_separator determines how multiple version paths are specified;
# see https://alembic.sqlalchemy.org/en/latest/tutorial.html#working-with-multiple-bases
# version_path_separator = os  # Use os.pathsep. Default configuration used for new projects.
# version_path_separator = ;   # semicolon, recommended for Windows
version_path_separator = ;

# The output encoding used when revision files are written from script.py.mako;
# see https://alembic.sqlalchemy.org/en/latest/autogenerate.html#controlling-what-to-compare
# output_encoding = utf-8

# NOTE: sqlalchemy.url is intentionally NOT set here.
# The database URL is read from the DATABASE_URL environment variable in env.py.
# This ensures credentials are never committed to version control.

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples

# format using "black" - use the console_scripts runner, against the "black" entrypoint
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88 REVISION_SCRIPT_FILENAME

# Logging configuration — matches the format used in app/main.py
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
